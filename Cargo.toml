[package]
name = "fineshot"
version = "0.1.1"
edition = "2024"
authors = ["Fabian"]
license = "MIT"
description = "Ultra-lightweight native Rust screenshotting and annotation utility"
repository = "https://github.com/FabianDream/FineShot"

[dependencies]
xcap = "0.9.10"
winit = "0.30"
softbuffer = "0.4"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "tga", "qoi", "gif"] }
arboard = "3.7"
rfd = "0.18"
tray-icon = "0.27"
global-hotkey = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
